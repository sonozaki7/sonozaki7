<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">So's WakaTime focus and leverage tracker</title>
  <desc id="desc">Privacy-safe active coding time with exact daily, weekly, monthly, and yearly trends. Project and file identities are excluded.</desc>
  <defs><linearGradient id="focus-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFB"/></linearGradient><style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #181915; }
    .focus-eyebrow,.focus-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; letter-spacing: 1.6px; fill: #355F78; }
    .focus-eyebrow { font-size: 13px; letter-spacing: 2.6px; }.focus-label { font-size: 10px; fill: #68757C; }
    .focus-title { font-family: Georgia, "Times New Roman", serif; font-size: 40px; font-weight: 700; letter-spacing: -1.1px; }
    .focus-subtitle { font-size: 15px; fill: #68757C; }.focus-value { font-size: 29px; font-weight: 750; }.focus-note { font-size: 11px; fill: #98A3A9; }
    .focus-point { font-size: 9px; font-weight: 650; }.focus-axis,.focus-footer,.focus-empty { font-size: 9px; fill: #98A3A9; }.focus-footer { font-size: 11px; }.focus-empty { font-size: 12px; }
  </style></defs>
  <rect x="1" y="1" width="1198" height="848" rx="10" fill="url(#focus-bg)" stroke="#DCE3E7" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="2" fill="#355F78"/>
  <text x="52" y="64" class="focus-eyebrow">FOCUS &amp; LEVERAGE · WAKATIME</text>
  <text x="52" y="106" class="focus-title">Time invested, momentum earned</text>
  <text x="52" y="134" class="focus-subtitle">Active editor time · Tracking since 2026-08-12 · Asia/Bangkok</text>
  <g transform="translate(52 162)"><rect width="262" height="96" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><text x="20" y="27" class="focus-label">TODAY</text><text x="20" y="61" class="focus-value">0h</text><text x="20" y="81" class="focus-note">0 active days / 30</text></g>
  <g transform="translate(330 162)"><rect width="262" height="96" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><text x="20" y="27" class="focus-label">LAST 7 DAYS</text><text x="20" y="61" class="focus-value">0h</text><text x="20" y="81" class="focus-note">0h avg / active day</text></g>
  <g transform="translate(608 162)"><rect width="262" height="96" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><text x="20" y="27" class="focus-label">LAST 30 DAYS</text><text x="20" y="61" class="focus-value">0h</text><text x="20" y="81" class="focus-note">— commits / focus hour</text></g>
  <g transform="translate(886 162)"><rect width="262" height="96" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><text x="20" y="27" class="focus-label">LIFETIME</text><text x="20" y="61" class="focus-value">0h</text><text x="20" y="81" class="focus-note">0 recorded focus days</text></g>
  <g>
    <rect x="52" y="286" width="538" height="238" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/>
    <text x="72" y="314" class="focus-label">DAILY · LAST 14 DAYS</text>
    <line x1="74" y1="490" x2="568" y2="490" stroke="#DCE3E7"/>

    <text x="321.0" y="412.0" text-anchor="middle" class="focus-empty">Tracking begins with your next coding session</text>
  </g>
  <g>
    <rect x="610" y="286" width="538" height="238" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/>
    <text x="630" y="314" class="focus-label">WEEKLY · LAST 12 WEEKS</text>
    <line x1="632" y1="490" x2="1126" y2="490" stroke="#DCE3E7"/>

    <text x="879.0" y="412.0" text-anchor="middle" class="focus-empty">Tracking begins with your next coding session</text>
  </g>
  <g>
    <rect x="52" y="544" width="538" height="238" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/>
    <text x="72" y="572" class="focus-label">MONTHLY · LAST 12 MONTHS</text>
    <line x1="74" y1="748" x2="568" y2="748" stroke="#DCE3E7"/>

    <text x="321.0" y="670.0" text-anchor="middle" class="focus-empty">Tracking begins with your next coding session</text>
  </g>
  <g>
    <rect x="610" y="544" width="538" height="238" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/>
    <text x="630" y="572" class="focus-label">YEARLY · WAKATIME LIFETIME</text>
    <line x1="632" y1="748" x2="1126" y2="748" stroke="#DCE3E7"/>

    <text x="879.0" y="670.0" text-anchor="middle" class="focus-empty">Tracking begins with your next coding session</text>
  </g>
  <text x="52" y="822" class="focus-footer">Aggregate active seconds only · no project, file, repository, branch, language, editor, or machine names are published</text>
</svg>