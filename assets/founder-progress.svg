  <g transform="translate(52 719)"><rect width="342" height="122" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><rect x="0" y="0" width="4" height="122" rx="2" fill="#355F78"/><text x="22" y="28" class="review-label">CURRENT PACE</text><text x="22" y="52" class="review-guidance"><tspan x="22" dy="0">Shipping rhythm is broadly steady versus last</tspan><tspan x="22" dy="16">month. Improve one repeatable step—testing,</tspan><tspan x="22" dy="16">release, or customer feedback—before chasing</tspan><tspan x="22" dy="16">more volume.</tspan></text></g><g transform="translate(418 719)"><rect width="342" height="122" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><rect x="0" y="0" width="4" height="122" rx="2" fill="#355F78"/><text x="22" y="28" class="review-label">3-MONTH SIGNAL</text><text x="22" y="52" class="review-guidance"><tspan x="22" dy="0">+77% commit throughput versus the prior three</tspan><tspan x="22" dy="16">complete months. Use the direction as a workflow</tspan><tspan x="22" dy="16">signal, not a quality score.</tspan></text></g><g transform="translate(784 719)"><rect width="342" height="122" rx="6" fill="#FAFBFC" stroke="#DCE3E7"/><rect x="0" y="0" width="4" height="122" rx="2" fill="#355F78"/><text x="22" y="28" class="review-label">FOCUS LEVERAGE</text><text x="22" y="52" class="review-guidance"><tspan x="22" dy="0">Compare focus hours with shipped commits and</tspan><tspan x="22" dy="16">releases. More output per focused hour can</tspan><tspan x="22" dy="16">indicate better tooling, automation, and AI</tspan><tspan x="22" dy="16">leverage.</tspan></text></g>
