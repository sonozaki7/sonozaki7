<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1778" viewBox="0 0 375 1778" role="img" aria-labelledby="title desc"><title id="title">So's mobile twelve-month founder operating review</title><desc id="desc">Exact month-by-month workflow signals with pace-adjusted guidance.</desc><defs><linearGradient id="mr-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFB"/></linearGradient><style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#181915}.mr-eyebrow,.mr-label,.mr-month{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;letter-spacing:1px;fill:#355F78}.mr-eyebrow{font-size:9px;letter-spacing:1.5px}.mr-label,.mr-month{font-size:9px}.mr-label{fill:#68757C}.mr-title{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:700}.mr-subtitle,.mr-small,.mr-footer,.mr-guidance{font-size:8px;fill:#68757C}.mr-guidance{font-size:9px}.mr-head{font-size:19px;font-weight:750}.mr-tiny{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:6px;fill:#98A3A9;letter-spacing:.3px}.mr-number{font-size:12px;font-weight:750}
  </style></defs><rect x="1" y="1" width="373" height="1776" rx="8" fill="url(#mr-bg)" stroke="#DCE3E7" stroke-width="2"/><rect x="16" y="15" width="343" height="2" fill="#355F78"/><text x="20" y="43" class="mr-eyebrow">12-MONTH FOUNDER OPERATING REVIEW</text><text x="20" y="76" class="mr-title">One year of compounding</text><text x="20" y="96" class="mr-subtitle">2025-10 → 2026-09 · partial months are pace-adjusted</text>
  <g transform="translate(20 119)"><rect width="164" height="65" rx="5" fill="#FAFBFC" stroke="#DCE3E7"/><text x="13" y="19" class="mr-label">CONTRIBUTIONS</text><text x="13" y="45" class="mr-head">3</text><text x="13" y="58" class="mr-small">−92% pace</text></g><g transform="translate(191 119)"><rect width="164" height="65" rx="5" fill="#FAFBFC" stroke="#DCE3E7"/><text x="13" y="19" class="mr-label">SHIP DAYS</text><text x="13" y="45" class="mr-head">1/2</text><text x="13" y="58" class="mr-small">−40% pace</text></g><g transform="translate(20 191)"><rect width="164" height="65" rx="5" fill="#FAFBFC" stroke="#DCE3E7"/><text x="13" y="19" class="mr-label">COMMITS / DAY</text><text x="13" y="45" class="mr-head">2.0</text><text x="13" y="58" class="mr-small">−90% density</text></g><g transform="translate(191 191)"><rect width="164" height="65" rx="5" fill="#FAFBFC" stroke="#DCE3E7"/><text x="13" y="19" class="mr-label">FOCUS</text><text x="13" y="45" class="mr-head">0h</text><text x="13" y="58" class="mr-small">WakaTime active time</text></g>
