name: Refresh founder progress

on:
  schedule:
    - cron: "10 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/founder-progress.yml"

concurrency:
  group: founder-progress
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate aggregate progress tracker
        env:
          GITHUB_TOKEN: ${{ secrets.TRACKER_TOKEN }}
          TRACKER_USERNAME: ${{ github.repository_owner }}
          TRACKER_TIMEZONE: Asia/Bangkok
        run: npm run generate

      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/founder-progress.svg assets/founder-progress-mobile.svg assets/founder-progress.png assets/founder-lifetime.svg assets/founder-lifetime-mobile.svg assets/founder-lifetime.png assets/share-copy.txt metrics/latest.json metrics/history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh founder progress"
          git push
